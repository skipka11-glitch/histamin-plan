<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Histamín Plán — Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f3ede2;
    --paper: #faf6ee;
    --ink: #2b2620;
    --ink-soft: #5b544a;
    --ink-mute: #8a8175;
    --sage: #8a9a7e;
    --sage-deep: #5f6f55;
    --line: #d9d1c0;
  }
  html, body {
    margin: 0; padding: 0;
    background: #e9e4d8;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 16px;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(138,154,126,0.12), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(199,169,139,0.14), transparent 55%),
      #efe9dc;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr;
    padding: 14mm 12mm;
    page-break-after: always;
    break-after: page;
    position: relative;
  }
  .page:last-child { page-break-after: auto; }

  .page-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: 1px solid rgba(43,38,32,0.18);
    padding-bottom: 10mm;
    margin-bottom: 8mm;
  }
  .crumb {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9pt;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32pt;
    font-weight: 400;
    line-height: 1;
    color: var(--ink);
    margin-top: 6mm;
    letter-spacing: -0.01em;
  }
  .title em {
    font-style: italic; color: var(--sage-deep);
  }
  .pagenum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9pt;
    color: var(--ink-mute);
    letter-spacing: 0.12em;
  }

  .body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 10mm;
    align-items: start;
  }

  .frame-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .frame {
    width: 402px;
    height: 660px;
    transform-origin: top center;
  }

  /* Scale the 402x660 device down to fit ~75mm wide print column */
  .frame-scale {
    transform: scale(0.72);
    transform-origin: top center;
    width: 402px;
    height: 660px;
    margin-bottom: -185px; /* compensate for scale shrink */
    margin-right: -113px;
  }

  .notes {
    padding-top: 4mm;
  }
  .notes h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18pt;
    font-weight: 400;
    color: var(--ink);
    margin: 0 0 4mm;
    letter-spacing: -0.005em;
  }
  .notes p {
    font-size: 10.5pt;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 4mm;
  }
  .notes em {
    font-style: italic; color: var(--sage-deep);
  }
  .bullets {
    list-style: none;
    padding: 0;
    margin: 4mm 0 0;
  }
  .bullets li {
    display: flex;
    gap: 3mm;
    padding: 2.5mm 0;
    border-bottom: 1px dashed var(--line);
    font-size: 10pt;
    color: var(--ink);
  }
  .bullets li::before {
    content: '';
    flex-shrink: 0;
    width: 5px; height: 5px; margin-top: 5px;
    border-radius: 50%;
    background: var(--sage);
  }
  .bullets.warn li::before { background: #b8745a; }
  .bullets li b {
    font-weight: 500;
    color: var(--ink);
    margin-right: 4px;
  }

  .footer {
    position: absolute;
    bottom: 6mm; left: 12mm; right: 12mm;
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 8pt;
    color: var(--ink-mute);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Cover page */
  .cover {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24mm 18mm;
  }
  .cover .display {
    font-family: 'Cormorant Garamond', serif;
    font-size: 64pt;
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: -0.02em;
    font-weight: 400;
  }
  .cover .display em {
    font-style: italic; color: var(--sage-deep);
  }
  .cover .sub {
    font-size: 12pt;
    color: var(--ink-soft);
    max-width: 110mm;
    line-height: 1.5;
    margin-top: 12mm;
  }
  .cover .meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8mm;
    margin-top: 16mm;
    padding-top: 8mm;
    border-top: 1px solid rgba(43,38,32,0.2);
  }
  .cover .meta div b {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22pt;
    font-weight: 400;
    color: var(--ink);
    display: block;
  }

  @page {
    size: A4 portrait;
    margin: 0;
  }

  @media print {
    html, body { background: #fff; }
    .page {
      margin: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .page:last-child {
      page-break-after: auto;
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
// Each screen rendered into a phone frame for print

function PhoneFrame({ children }) {
  return (
    <div className="frame-scale">
      <IOSDevice width={402} height={660} title="Histamín">
        <div style={{
          width: '100%', height: '100%',
          overflow: 'hidden',
          background: PALETTE.cream,
        }}>
          {children}
        </div>
      </IOSDevice>
    </div>
  );
}

function Page({ num, label, title, frame, children }) {
  return (
    <div className="page">
      <div className="page-head">
        <div>
          <div className="crumb">{label}</div>
          <div className="title">{title}</div>
        </div>
        <div className="pagenum">{num} / 06</div>
      </div>
      <div className="body">
        <div className="notes">{children}</div>
        <div className="frame-wrap">{frame}</div>
      </div>
      <div className="footer">
        <span>Histamín · denný plán</span>
        <span>Lea · 27. máj 2026</span>
      </div>
    </div>
  );
}

function Cover() {
  return (
    <div className="page cover">
      <div>
        <div className="crumb">Denný plán · histamínova diéta</div>
        <div className="display" style={{ marginTop: '8mm' }}>
          Päť jemných<br/>
          <em>jedál,</em><br/>
          jeden pokojný<br/>
          <em>deň.</em>
        </div>
        <div className="sub">
          Mobilná appka pre nízkohistamínový režim — denný plán jedál, knižnica
          povolených a zakázaných potravín, rituál doplnkov a symptom denník.
          Návrh vytlačený pre offline prezeranie.
        </div>
      </div>
      <div>
        <div className="meta">
          <div>
            <div className="crumb">Jedlá</div>
            <b>5</b>
            <span style={{ fontSize: '9pt', color: 'var(--ink-mute)' }}>3 hlavné + 2 snacky</span>
          </div>
          <div>
            <div className="crumb">Doplnky</div>
            <b>4</b>
            <span style={{ fontSize: '9pt', color: 'var(--ink-mute)' }}>DAO, C, B6, kvercetín</span>
          </div>
          <div>
            <div className="crumb">Histamín</div>
            <b>nízky</b>
            <span style={{ fontSize: '9pt', color: 'var(--ink-mute)' }}>žiadne kvasené, zrejúce</span>
          </div>
        </div>
        <div className="footer" style={{ position: 'static', marginTop: '8mm', justifyContent: 'space-between', padding: 0 }}>
          <span>Histamín · denný plán</span>
          <span>v1 · prototyp</span>
        </div>
      </div>
    </div>
  );
}

function PrintDoc() {
  // Patch HomeScreen — we need a snapshot of day plan without the toggle interaction.
  const meal = TODAY_MEALS[2]; // Obed for recipe page
  return (
    <>
      <Cover/>

      <Page
        num="02"
        label="Obrazovka 01 · Dnes"
        title={<>Denný<br/><em>plán jedál</em></>}
        frame={<PhoneFrame><HomeScreen onOpenMeal={() => {}} view="den" setView={() => {}}/></PhoneFrame>}
      >
        <h3>Päť okien dňa</h3>
        <p>
          Hlavná obrazovka prevedie deň cez <em>raňajky, dopoludňajší snack, obed, popoludňajší snack a večeru</em>.
          Každá karta nesie čas, dĺžku prípravy a indikátor histamínového skóre. Tap otvorí recept.
        </p>
        <ul className="bullets">
          <li><span><b>8:00</b> Ovsená kaša s čučoriedkami</span></li>
          <li><span><b>10:30</b> Hruška & čerstvý tvaroh</span></li>
          <li><span><b>13:00</b> Kuracie prsia s ryžou a cuketou</span></li>
          <li><span><b>16:00</b> Ryžové chlebíky s kozím syrom</span></li>
          <li><span><b>19:00</b> Tekvicový krém s pečenou repou</span></li>
        </ul>
      </Page>

      <Page
        num="03"
        label="Obrazovka 02 · Recept"
        title={<>{meal.title.split(' s ')[0]}<br/><em>s ryžou & cuketou</em></>}
        frame={<PhoneFrame><RecipeScreen meal={meal} onBack={() => {}}/></PhoneFrame>}
      >
        <h3>Detail receptu</h3>
        <p>
          Tri taby — <em>Postup, Suroviny, Prečo</em>. Postup vedie krok za krokom, suroviny obsahujú
          presné množstvá pre jednu porciu, sekcia <em>Prečo</em> vysvetľuje histamínový kontext.
        </p>
        <ul className="bullets">
          {meal.steps.slice(0, 4).map((s, i) => (
            <li key={i}><span>{s}</span></li>
          ))}
        </ul>
        <p style={{ marginTop: '5mm', fontStyle: 'italic', color: 'var(--sage-deep)' }}>
          „{meal.note}"
        </p>
      </Page>

      <Page
        num="04"
        label="Obrazovka 03 · Knižnica"
        title={<>Čo môžem,<br/><em>čo nie</em></>}
        frame={<PhoneFrame><FoodsScreen/></PhoneFrame>}
      >
        <h3>Potravinová knižnica</h3>
        <p>
          Prepínač <em>Povolené / Vyhnúť</em> filtruje knižnicu po kategóriách. Rýchla pomôcka, keď stojíš v obchode a nevieš, či je niečo bezpečné.
        </p>
        <ul className="bullets">
          <li><span><b>Povolené:</b> čerstvé mäso (do 24h), ryža, ovsené vločky, cuketa, mrkva, jablko, čučoriedky, mladý kozí syr, olivový olej, mandle, med</span></li>
        </ul>
        <ul className="bullets warn">
          <li><span><b>Vyhnúť:</b> paradajky, špenát, baklažán, citrusy, banán, jahody, čokoláda, kakao, orechy, ocot, kvasené (jogurt, kefír, kombucha), zrejúce syry, údeniny, alkohol</span></li>
        </ul>
      </Page>

      <Page
        num="05"
        label="Obrazovka 04 · Doplnky"
        title={<>Denný<br/><em>rituál</em></>}
        frame={<PhoneFrame><PillsScreen/></PhoneFrame>}
      >
        <h3>DAO + podporné mikronutrienty</h3>
        <p>
          Harmonogram dávok, ktoré odškrtáš po užití. Vrchné okienko ukazuje progres dňa.
        </p>
        <ul className="bullets">
          <li><span><b>DAO enzým</b> · 1 tbl. · 30 min pred raňajkami, obedom a večerou</span></li>
          <li><span><b>Vitamín C</b> · 1000 mg · rozdelene 8:30 a 16:00</span></li>
          <li><span><b>Vitamín B6 (P5P)</b> · 50 mg · k raňajkam</span></li>
          <li><span><b>Kvercetín</b> · 500 mg · k obedu</span></li>
        </ul>
        <p style={{ marginTop: '5mm', fontStyle: 'italic', color: 'var(--sage-deep)' }}>
          DAO ber 15–30 minút <em>pred</em> jedlom, aby stihol zahájiť činnosť.
        </p>
      </Page>

      <Page
        num="06"
        label="Obrazovka 05 · Pocit"
        title={<>Symptom<br/><em>denník</em></>}
        frame={<PhoneFrame><FeelScreen/></PhoneFrame>}
      >
        <h3>Ako sa cítiš dnes?</h3>
        <p>
          Osem najčastejších symptómov histamínovej intolerancie ohodnotíš na škále <em>nič → mierne → stredné → silné</em>.
          Skóre pohody sa vypočíta automaticky a ukladá do denníka — užitočné pri hľadaní spúšťačov.
        </p>
        <ul className="bullets">
          <li><span>Bolesť hlavy</span></li>
          <li><span>Nafukovanie & tráviace ťažkosti</span></li>
          <li><span>Vyrážka / svrbenie</span></li>
          <li><span>Búšenie srdca</span></li>
          <li><span>Upchatý nos</span></li>
          <li><span>Únava & úzkosť</span></li>
        </ul>
      </Page>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PrintDoc/>);

// Auto-print once everything is ready
(async () => {
  if (document.fonts && document.fonts.ready) {
    await document.fonts.ready;
  }
  await new Promise(r => setTimeout(r, 800));
  window.print();
})();
</script>
</body>
</html>
