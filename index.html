<style>
  :root {
    --cream: #f3ede2;
    --cream-deep: #e8dfd0;
    --paper: #faf6ee;
    --ink: #2b2620;
    --ink-soft: #5b544a;
    --ink-mute: #8a8175;
    --sage: #8a9a7e;
    --sage-deep: #5f6f55;
    --sage-tint: #d9dfce;
    --wood: #c7a98b;
    --terra: #b8745a;
    --line: #d9d1c0;
  }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #1a1714;
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(138,154,126,0.08), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(199,169,139,0.08), transparent 60%),
      #1a1714;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    box-sizing: border-box;
  }
  #root { display: flex; align-items: center; justify-content: center; }
  * { box-sizing: border-box; }

  /* Standalone (installed PWA) — fill the viewport, no letterboxing */
  body.standalone {
    padding: 0;
    background: var(--cream);
    align-items: stretch;
    justify-content: stretch;
  }
  body.standalone #root {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: block;
  }
  body.standalone {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
</style>

<script>
  // Mark body when launched as installed PWA so app.jsx can skip the device bezel
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (isStandalone) document.body.classList.add('standalone');

  // Register service worker for offline use
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Capture install prompt for Android/desktop Chromium
  window.__deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.__deferredPrompt = e;
    window.dispatchEvent(new CustomEvent('installprompt:ready'));
  });
  window.addEventListener('appinstalled', () => {
    window.__deferredPrompt = null;
    window.dispatchEvent(new CustomEvent('installprompt:installed'));
  });
</script>
